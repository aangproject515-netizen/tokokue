<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aang Cakeshop — Web App Pro</title>
    <!-- Tailwind CSS CDN Stable Version -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #FDFBF7; color: #4A3B32; }
        .bg-cream { background-color: #FDFBF7; }
        .bg-chocolate { background-color: #4A3B32; }
        .text-chocolate { color: #4A3B32; }
        .bg-pink-btn { background-color: #D9777F; }
        .bg-pink-btn:hover { background-color: #C5646C; }
        .text-pink-custom { color: #D9777F; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
        .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-cream min-h-screen flex flex-col pb-20">
    <!-- TOP HEADER / NAVBAR -->
    <header id="topHeader" class="bg-[#FDFBF7] border-b border-orange-100 sticky top-0 z-50 px-4 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="showHome()">
            <span class="text-2xl">🍰</span>
            <div>
                <h1 class="font-bold text-lg text-chocolate leading-tight">Aang Cakeshop</h1>
                <p class="text-[10px] text-gray-500">Setiap Kue, Ada Cerita Manisnya ❤</p>
            </div>
        </div>
        <div class="flex items-center space-x-3">
            <button onclick="checkSellerChatAccess()" class="text-xl p-1 relative" title="Chat">💬</button>
            <button onclick="showNotifications()" class="text-xl p-1 relative" title="Notifikasi">
                🔔<span id="notifBadge" class="hidden absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full"></span>
            </button>
            <button onclick="showCart()" class="text-xl p-1 relative" title="Keranjang">🛒</button>
        </div>
    </header>
    <!-- MAIN DYNAMIC CONTENT CONTAINER -->
    <main id="contentContainer" class="flex-1 max-w-2xl w-full mx-auto p-4">
        <div class="text-center py-10">
            <p class="text-xs text-gray-400 font-bold">Sedang memuat kue-kue manis...</p>
        </div>
    </main>
    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-2xl mx-auto bg-white border-t border-gray-200 h-16 flex justify-around items-center z-50 shadow-lg px-2">
        <button onclick="setActiveNav('home'); showHome()" class="flex flex-col items-center flex-1 text-pink-custom" id="navHome">
            <span class="text-xl">⌂</span>
            <span class="text-[10px] font-bold">Beranda</span>
        </button>
        <button onclick="setActiveNav('category'); showCategory()" class="flex flex-col items-center flex-1 text-gray-400" id="navCategory">
            <span class="text-xl">▦</span>
            <span class="text-[10px]">Kategori</span>
        </button>
        <button onclick="setActiveNav('cart'); showCart()" class="flex flex-col items-center flex-1 text-gray-400" id="navCart">
            <span class="text-xl">🛒</span>
            <span class="text-[10px]">Keranjang</span>
        </button>
        <button onclick="setActiveNav('promo'); showPromo()" class="flex flex-col items-center flex-1 text-gray-400" id="navPromo">
            <span class="text-xl">%</span>
            <span class="text-[10px]">Promo</span>
        </button>
        <button onclick="setActiveNav('account'); showAccount()" class="flex flex-col items-center flex-1 text-gray-400" id="navAccount">
            <span class="text-xl">♙</span>
            <span class="text-[10px]">Akun</span>
        </button>
    </nav>
    <!-- JAVASCRIPT LOGIC & API INTEGRATION -->
    <script>
        const BASE_URL = "https://script.google.com/macros/s/AKfycbw2Ge_T1r5AaiVGnlJzgTgnGSJUrV2tA2hyMBSAhZ8rk483ojB1ZRRg-iwCPJcEhxuFuw/exec";
        let products = [];
        let categories = [];
        let promos = [];
        let shippingSettings = [];
        let bonusRulesList = [];
        let favorites = JSON.parse(localStorage.getItem('favs') || '[]');
        let cart = JSON.parse(localStorage.getItem('cart') || '[]');
        let isSellerLoggedIn = localStorage.getItem('is_seller') === 'true';
        let sellerName = localStorage.getItem('seller_name') || 'Penjual Utama';
        let isUserLoggedIn = localStorage.getItem('is_user') === 'true';
        
        let currentUserId = localStorage.getItem('user_id') || (() => {
            const id = 'USER_' + Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('user_id', id);
            return id;
        })();
        let currentUserName = localStorage.getItem('user_name') || 'Pembeli Web';
        let currentUserEmail = localStorage.getItem('user_email') || '';
        const PROVINCES_CITIES = {
            "DKI Jakarta": ["Jakarta Timur", "Jakarta Pusat", "Jakarta Selatan", "Jakarta Barat", "Jakarta Utara"],
            "Jawa Barat": ["Kota Bandung", "Kota Bekasi", "Kota Depok", "Kota Bogor", "Kabupaten Bandung", "Cimahi", "Karawang"],
            "Banten": ["Tangerang", "Tangerang Selatan", "Serang", "Cilegon"],
            "Jawa Tengah": ["Semarang", "Surakarta", "Magelang", "Tegal", "Pekalongan"],
            "D.I. Yogyakarta": ["Yogyakarta", "Sleman", "Bantul", "Kulon Progo", "Gunungkidul"],
            "Jawa Timur": ["Surabaya", "Malang", "Sidoarjo", "Kediri", "Jember"],
            "Bali": ["Denpasar", "Badung", "Gianyar", "Buleleng"],
            "Nusa Tenggara Barat (NTB)": ["Mataram", "Lombok"],
            "Nusa Tenggara Timur (NTT)": ["Kupang"],
            "Aceh": ["Banda Aceh"],
            "Sumatera Utara": ["Medan"],
            "Sumatera Barat": ["Padang"],
            "Riau": ["Pekanbaru"],
            "Kepulauan Riau": ["Batam"],
            "Jambi": ["Jambi"],
            "Sumatera Selatan": ["Palembang"],
            "Kepulauan Bangka Belitung": ["Pangkal Pinang"],
            "Bengkulu": ["Bengkulu"],
            "Lampung": ["Bandar Lampung"],
            "Kalimantan Barat": ["Pontianak"],
            "Kalimantan Tengah": ["Palangka Raya"],
            "Kalimantan Selatan": ["Banjarmasin"],
            "Kalimantan Timur": ["Samarinda", "Balikpapan"],
            "Kalimantan Utara": ["Tarakan"],
            "Sulawesi Utara": ["Manado"],
            "Sulawesi Tengah": ["Palu"],
            "Sulawesi Selatan": ["Makassar"],
            "Sulawesi Tenggara": ["Kendari"],
            "Gorontalo": ["Gorontalo"],
            "Sulawesi Barat": ["Mamuju"],
            "Maluku": ["Ambon"],
            "Maluku Utara": ["Ternate"],
            "Papua": ["Jayapura"],
            "Papua Barat": ["Manokwari"],
            "Papua Selatan": ["Merauke"],
            "Papua Tengah": ["Nabire"],
            "Papua Pegunungan": ["Wamena"],
            "Papua Barat Daya": ["Sorong"]
        };
        function formatRupiah(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount || 0).replace(',00', '');
        }
        function showMessage(title, message) {
            alert(`${title}: ${message}`);
        }
        function safeText(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }
        async function loadAllData() {
            try {
                const [resProd, resCat, resPromo, resShip, resBonus] = await Promise.all([
                    fetch(`${BASE_URL}?action=products`).then(r => r.json()).catch(() => null),
                    fetch(`${BASE_URL}?action=categories`).then(r => r.json()).catch(() => null),
                    fetch(`${BASE_URL}?action=promos`).then(r => r.json()).catch(() => null),
                    fetch(`${BASE_URL}?action=get_shipping_settings`).then(r => r.json()).catch(() => null),
                    fetch(`${BASE_URL}?action=get_bonus_products`).then(r => r.json()).catch(() => null)
                ]);
                if (resProd && resProd.success) products = resProd.data || [];
                if (resCat && resCat.success) categories = resCat.data || [];
                if (resPromo && resPromo.success) promos = resPromo.data || [];
                if (resShip && resShip.success) shippingSettings = resShip.data || [];
                if (resBonus && resBonus.success) bonusRulesList = resBonus.data || [];
            } catch (e) {
                console.warn("Gagal memuat beberapa data dari server:", e);
            } finally {
                showHome();
                startNotificationLoop();
            }
        }
        // Timer Notifikasi 5 Menit Sekali
        function startNotificationLoop() {
            setInterval(() => {
                const badge = document.getElementById('notifBadge');
                if (badge) badge.classList.remove('hidden');
            }, 300000); // 5 menit
        }
        function setActiveNav(nav) {
            ['Home', 'Category', 'Cart', 'Promo', 'Account'].forEach(n => {
                const btn = document.getElementById('nav' + n);
                if (btn) {
                    btn.classList.remove('text-pink-custom', 'font-bold');
                    btn.classList.add('text-gray-400');
                }
            });
            const active = document.getElementById('nav' + nav.charAt(0).toUpperCase() + nav.slice(1));
            if (active) {
                active.classList.remove('text-gray-400');
                active.classList.add('text-pink-custom', 'font-bold');
            }
        }
        // ================= 1. BERANDA =================
        function showHome() {
            window.currentViewFunc = showHome;
            setActiveNav('home');
            const container = document.getElementById('contentContainer');
            
            let html = `
                <div class="space-y-4">
                    <div>
                        <input type="text" id="searchInput" placeholder="Cari kue favorit kamu di sini..." oninput="filterHomeProducts(this.value)" 
                            class="w-full px-4 py-3 rounded-xl border border-orange-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-[#D9777F]">
                    </div>
                    <div>
                        <h2 class="font-bold text-chocolate text-base mb-2">Kategori</h2>
                        <div class="flex overflow-x-auto space-x-3 pb-2 scrollbar-none">
                            ${(categories.length ? categories : getDefaultCategories()).map(c => `
                                <div onclick="showProductList('${safeText(c.name)}')" class="flex-shrink-0 w-20 h-24 bg-orange-50 border border-orange-100 rounded-xl flex flex-col items-center justify-center p-2 cursor-pointer shadow-sm">
                                    <span class="text-2xl">${c.icon}</span>
                                    <span class="text-[11px] font-bold text-chocolate text-center mt-1 truncate w-full">${safeText(c.name)}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div onclick="showPromo()" class="bg-gradient-to-r from-pink-100 to-orange-100 border border-pink-200 rounded-2xl p-4 cursor-pointer shadow-sm">
                        <h3 class="font-bold text-chocolate text-sm">🎉 Promo Manis Diskon Spesial!</h3>
                        <p class="text-xs text-gray-600 mt-1">Untuk Hari-Hari Spesial Kamu ❤ Lihat Promo →</p>
                    </div>
                    <div>
                        <h2 class="font-bold text-chocolate text-base mb-2">Produk Pilihan</h2>
                        <div id="productGrid" class="grid grid-cols-2 gap-3">
                            ${renderProductCards(products)}
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }
        function filterHomeProducts(keyword) {
            const grid = document.getElementById('productGrid');
            const q = String(keyword || '').trim().toLowerCase();
            const filtered = products.filter(p => String(p.status || 'active').toLowerCase() === 'active' && (String(p.name || '').toLowerCase().includes(q) || String(p.description || '').toLowerCase().includes(q) || String(p.category || '').toLowerCase().includes(q)));
            grid.innerHTML = renderProductCards(filtered);
        }
        function renderProductCards(prods) {
            if (!prods.length) return `<p class="col-span-2 text-center text-gray-400 py-6 text-xs">Belum ada produk kue.</p>`;
            return prods.map(p => {
                const isFav = favorites.includes(p.id);
                const displayImg = p.image || (p.images && p.images[0]) || '';
                return `
                    <div class="bg-white border border-orange-100 rounded-2xl p-2.5 flex flex-col shadow-sm">
                        <div class="relative h-36 rounded-xl overflow-hidden bg-gray-100 cursor-pointer" onclick="showProductDetail('${p.id}')">
                            <img src="${displayImg}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/150?text=Kue'">
                            <button onclick="event.stopPropagation(); toggleFavorite('${p.id}')" class="absolute top-2 right-2 w-8 h-8 bg-white/90 rounded-full flex items-center justify-center text-pink-custom shadow-sm text-lg">
                                ${isFav ? '♥' : '♡'}
                            </button>
                        </div>
                        <h3 class="font-bold text-chocolate text-xs mt-2 line-clamp-2 cursor-pointer" onclick="showProductDetail('${p.id}')">${safeText(p.name)}</h3>
                        <p class="text-[10px] text-gray-400 mt-0.5">⭐ ${p.rating ? p.rating.toFixed(1) : '0.0'} • ${p.sold_count || 0} terjual</p>
                        <p class="font-bold text-pink-custom text-xs mt-1">${formatRupiah(p.price)}</p>
                        <button onclick="addToCart('${p.id}')" ${p.stock <= 0 ? 'disabled' : ''} class="mt-2 w-full py-1.5 rounded-xl text-xs font-bold text-white bg-pink-btn ${p.stock <= 0 ? 'opacity-50 cursor-not-allowed' : ''}">
                            ${p.stock > 0 ? '+ Tambah' : 'Stok Habis'}
                        </button>
                    </div>
                `;
            }).join('');
        }
        // ================= 2. DETAIL PRODUK & CUSTOM VISUALIZER =================
        let rawProductReviews = [];
        async function showProductDetail(productId) {
            window.currentViewFunc = () => showProductDetail(productId);
            const p = products.find(item => item.id === productId);
            if (!p) return showHome();
            const container = document.getElementById('contentContainer');
            const activePromo = promos.find(pr => pr.productId === p.id || pr.productId === 'ALL');
            const finalPrice = activePromo ? p.price * (1 - activePromo.discount / 100) : p.price;
            window.currentDetailProductId = p.id;
            currentQty = 1;
            const imagesList = p.images && p.images.length ? p.images : [p.image];
            const customSizesOpt = (p.custom_sizes || "Diameter 16cm (Standar), Diameter 20cm (+Rp 50.000), Diameter 24cm (+Rp 100.000)").split(',');
            const customFlavorsOpt = (p.custom_flavors || "Cokelat Klasik, Vanilla Sponge, Red Velvet, Matcha Green Tea").split(',');
            const customCreamsOpt = (p.custom_creams || "Pink Pastel, Blue Pastel, Purple Lilac, Yellow Butter").split(',');
            container.innerHTML = `
                <div class="space-y-4 pb-12">
                    <button onclick="showHome()" class="text-sm font-bold text-chocolate flex items-center">← Kembali</button>
                    <div class="flex overflow-x-auto space-x-2 pb-2 scrollbar-none">
                        ${imagesList.map(img => `<img src="${img}" class="w-64 h-52 object-cover rounded-2xl flex-shrink-0 bg-gray-100 border border-orange-100" onerror="this.src='https://via.placeholder.com/300?text=Foto+Kue'">`).join('')}
                    </div>
                    <h1 class="text-xl font-bold text-chocolate">${safeText(p.name)}</h1>
                    <div class="flex items-baseline space-x-2">
                        <span class="text-2xl font-bold text-pink-custom">${formatRupiah(finalPrice)}</span>
                        ${activePromo ? `<span class="text-xs bg-pink-100 text-pink-custom px-2 py-0.5 rounded-full font-bold">Diskon ${activePromo.discount}%</span>` : ''}
                    </div>
                    <p class="text-xs text-gray-500">⭐ ${p.rating ? p.rating.toFixed(1) : '0.0'} / 5.0 • ${p.sold_count || 0} Terjual • Stok: ${p.stock}</p>
                    <!-- CUSTOM CAKE VISUALIZER INTERAKTIF -->
                    ${p.is_customable !== false ? `
                        <div class="bg-orange-50 border border-orange-200 p-4 rounded-2xl space-y-3">
                            <h3 class="font-bold text-chocolate text-xs">🎨 Custom Cake Visualizer Interaktif</h3>
                            
                            <!-- Box Preview Cake -->
                            <div id="cakeVisualizerBox" class="bg-white border-2 border-pink-200 rounded-xl p-4 text-center space-y-2 shadow-inner transition-all">
                                <div id="vizIcon" class="text-5xl">🎂</div>
                                <p id="vizFlavor" class="text-xs font-bold text-chocolate">${safeText(customFlavorsOpt[0])}</p>
                                <p id="vizSize" class="text-[10px] text-gray-500">${safeText(customSizesOpt[0])}</p>
                                <div id="vizMessage" class="text-xs font-bold text-pink-custom italic bg-pink-50 p-2 rounded-lg border border-pink-100">"Ucapan Selamat..."</div>
                            </div>
                            <div class="space-y-2">
                                <label class="block text-xs font-bold text-chocolate">Pilih Ukuran Kue:
                                    <select id="dtlSize" onchange="updateVisualizer()" class="w-full mt-1 p-2 bg-white border border-orange-200 rounded-xl text-xs">
                                        ${customSizesOpt.map(s => `<option value="${safeText(s.trim())}">${safeText(s.trim())}</option>`).join('')}
                                    </select>
                                </label>
                                <label class="block text-xs font-bold text-chocolate">Pilih Rasa Kue:
                                    <select id="dtlFlavor" onchange="updateVisualizer()" class="w-full mt-1 p-2 bg-white border border-orange-200 rounded-xl text-xs">
                                        ${customFlavorsOpt.map(f => `<option value="${safeText(f.trim())}">${safeText(f.trim())}</option>`).join('')}
                                    </select>
                                </label>
                                <label class="block text-xs font-bold text-chocolate">Pilih Warna Krim & Tema:
                                    <select id="dtlCream" onchange="updateVisualizer()" class="w-full mt-1 p-2 bg-white border border-orange-200 rounded-xl text-xs">
                                        ${customCreamsOpt.map(c => `<option value="${safeText(c.trim())}">${safeText(c.trim())}</option>`).join('')}
                                    </select>
                                </label>
                                <label class="block text-xs font-bold text-chocolate">Pesan Ucapan di Atas Kue:
                                    <input type="text" id="dtlMessage" oninput="updateVisualizer()" placeholder="Contoh: Happy Birthday Aang ❤" class="w-full mt-1 p-2 bg-white border border-orange-200 rounded-xl text-xs">
                                </label>
                            </div>
                        </div>
                    ` : ''}
                    <button onclick="showChatWindow('${p.id}')" class="w-full py-2.5 bg-white border border-orange-200 text-chocolate font-bold text-xs rounded-xl shadow-sm">
                        💬 Tanya Seller Mengenai Produk Ini
                    </button>
                    <div>
                        <h3 class="font-bold text-chocolate text-sm mb-1">Deskripsi Kue</h3>
                        <p class="text-xs text-gray-600 bg-white p-3 rounded-xl border border-orange-100 leading-relaxed">${safeText(p.description) || 'Tidak ada deskripsi produk.'}</p>
                    </div>
                    <!-- ULASAN DENGAN FILTER & FOTO -->
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <h3 class="font-bold text-chocolate text-sm">Ulasan Pembeli</h3>
                            <select id="reviewFilter" onchange="applyReviewFilter()" class="p-1.5 bg-white border border-orange-200 rounded-xl text-xs">
                                <option value="ALL">Semua Ulasan</option>
                                <option value="WITH_PHOTO">Ulasan dengan Foto 📷</option>
                                <option value="HIGH_RATING">Rating Tertinggi ⭐ 5</option>
                                <option value="LOW_RATING">Rating Terendah ⭐ 1-3</option>
                            </select>
                        </div>
                        <div id="reviewsList" class="space-y-2">
                            <p class="text-xs text-gray-400">Memuat ulasan...</p>
                        </div>
                        <button onclick="openReviewDialog('${p.id}')" class="mt-3 w-full py-2 bg-pink-btn text-white text-xs font-bold rounded-xl">
                            ✍ Beri Ulasan & Rating Kue Ini
                        </button>
                    </div>
                    <!-- PEMILIHAN QUANTITY & ACTION BUTTONS -->
                    <div class="flex items-center space-x-2 pt-4 border-t border-orange-100">
                        <div class="flex items-center border border-orange-200 rounded-xl bg-white">
                            <button onclick="adjustQty(-1)" class="w-8 h-10 font-bold text-lg text-chocolate">−</button>
                            <span id="qtyVal" class="w-8 text-center font-bold text-sm">1</span>
                            <button onclick="adjustQty(1)" class="w-8 h-10 font-bold text-lg text-chocolate">+</button>
                        </div>
                        <button onclick="addToCartQty('${p.id}')" class="flex-1 py-3 bg-white border border-pink-200 text-pink-custom font-bold text-xs rounded-xl shadow-sm">
                            🛒 + Keranjang
                        </button>
                        <button onclick="directCheckout('${p.id}')" class="flex-1 py-3 bg-pink-btn text-white font-bold text-xs rounded-xl shadow-md">
                            ⚡ Beli Langsung
                        </button>
                    </div>
                </div>
            `;
            loadReviews(p.id);
        }
        function updateVisualizer() {
            const size = document.getElementById('dtlSize')?.value || '';
            const flavor = document.getElementById('dtlFlavor')?.value || '';
            const cream = document.getElementById('dtlCream')?.value || '';
            const msg = document.getElementById('dtlMessage')?.value || '';
            const vizBox = document.getElementById('cakeVisualizerBox');
            const vizFlavor = document.getElementById('vizFlavor');
            const vizSize = document.getElementById('vizSize');
            const vizMsg = document.getElementById('vizMessage');
            if (vizFlavor) vizFlavor.textContent = flavor;
            if (vizSize) vizSize.textContent = size;
            if (vizMsg) vizMsg.textContent = msg ? `"${msg}"` : `"Ucapan Selamat..."`;
            if (vizBox) {
                if (cream.toLowerCase().includes('pink')) vizBox.style.backgroundColor = '#FFF0F3';
                else if (cream.toLowerCase().includes('blue')) vizBox.style.backgroundColor = '#F0F8FF';
                else if (cream.toLowerCase().includes('purple')) vizBox.style.backgroundColor = '#F3E8FF';
                else if (cream.toLowerCase().includes('yellow')) vizBox.style.backgroundColor = '#FEF9C3';
                else vizBox.style.backgroundColor = '#FFFFFF';
            }
        }
        let currentQty = 1;
        function adjustQty(val) {
            const currentProduct = products.find(item => item.id === (window.currentDetailProductId || ''));
            currentQty = Math.max(1, currentQty + val);
            if (currentProduct && currentProduct.stock > 0) currentQty = Math.min(currentQty, Number(currentProduct.stock));
            const el = document.getElementById('qtyVal');
            if (el) el.innerText = currentQty;
        }
        async function loadReviews(prodId) {
            const listEl = document.getElementById('reviewsList');
            if (!listEl) return;
            try {
                const res = await fetch(`${BASE_URL}?action=get_reviews&product_id=${encodeURIComponent(prodId)}`, { cache: 'no-store' }).then(r => r.json());
                if (res && res.success && res.data && res.data.length > 0) {
                    rawProductReviews = res.data;
                    applyReviewFilter();
                } else {
                    rawProductReviews = [];
                    listEl.innerHTML = `<p class="text-xs text-gray-400 italic">Belum ada ulasan untuk kue ini.</p>`;
                }
            } catch (e) {
                listEl.innerHTML = `<p class="text-xs text-gray-400 italic">Belum ada ulasan untuk kue ini.</p>`;
            }
        }
        function applyReviewFilter() {
            const filter = document.getElementById('reviewFilter')?.value || 'ALL';
            const listEl = document.getElementById('reviewsList');
            if (!listEl) return;
            let filtered = [...rawProductReviews];
            if (filter === 'WITH_PHOTO') filtered = filtered.filter(r => r.imageUrl && r.imageUrl.length > 0);
            else if (filter === 'HIGH_RATING') filtered = filtered.filter(r => Number(r.rating) === 5);

        function extractExtraPrice(option) {
            try {
                const match = String(option).match(/\+\s*(?:rp)?\s*([\d\.,]+)/i);
                if (match) {
                    const numStr = match[1].replace(/\./g, '').replace(/,/g, '');
                    return parseFloat(numStr) || 0.0;
                }
            } catch (e) {}
            return 0.0;
        }

                        const bp = products.find(p => p.id === rule.bonus_product_id);

        function calculateEstimation(prov, city, courier, date, time) {
            if (!date || !time) return "";
            const isInstant = courier.toLowerCase().includes("grabexpress") || courier.toLowerCase().includes("gosend");
            if (isInstant) {
                let h = parseInt(time.split(":")[0]) || 0;
                let h1 = (h + 1) % 24;
                let h2 = (h + 2) % 24;
                let h1Str = h1.toString().padStart(2, '0') + ":00";
                let h2Str = h2.toString().padStart(2, '0') + ":00";
                return `⚡ Estimasi Tiba: ${date} (Pukul ${h1Str} - ${h2Str} WIB) • Sampai di hari yang sama (Aman untuk Kue Basah/Tart)`;
            } else {
                let d = new Date(date);
                let estStr = "";
                let p = prov.toLowerCase();
                if (p === "dki jakarta") { d.setDate(d.getDate() + 1); estStr = "1 Hari Kerja setelah tanggal kirim"; }
                else if (p === "jawa barat" || p === "banten") { d.setDate(d.getDate() + 2); estStr = "1 - 2 Hari Kerja setelah tanggal kirim"; }
                else if (p === "jawa tengah" || p === "d.i. yogyakarta" || p === "jawa timur") { d.setDate(d.getDate() + 3); estStr = "2 - 3 Hari Kerja setelah tanggal kirim"; }
                else { d.setDate(d.getDate() + 5); estStr = "3 - 5 Hari Kerja setelah tanggal kirim"; }
                let estDate = d.toISOString().split('T')[0];
                return `🚚 Estimasi Tiba: ${date} s.d ${estDate} (${estStr})`;
            }
        }

            const estimateCard = document.getElementById('estimateInfoCard');
            const estimateText = document.getElementById('estimateText');
            const warningText = document.getElementById('warningText');
            
            const estStr = calculateEstimation(prov, city, courier, date, time);
            if (estStr) {
                estimateCard.classList.remove('hidden');
                estimateCard.classList.add('flex');
                estimateText.innerText = estStr;
                const isInstant = courier.toLowerCase().includes("grabexpress") || courier.toLowerCase().includes("gosend");
                const isDKI = prov.toLowerCase() === "dki jakarta";
                if (!isDKI && !isInstant) { warningText.classList.remove('hidden'); } 
                else { warningText.classList.add('hidden'); }
            } else {
                estimateCard.classList.add('hidden');
                estimateCard.classList.remove('flex');
            }

            if (!prov || !city) {
                currentCalculatedOngkir = getFallbackRegionalOngkir(prov, city);
                recalculateSummaryUI();
                return;
            }
            const dest = `${prov} ${city}`;
            try {
                const res = await apiPost('check_ongkir', { destination: dest, courier: courier, weight: 1000 });
                if (res && res.success && res.cost > 0) {
                    currentCalculatedOngkir = res.cost;
                } else {
                    currentCalculatedOngkir = getFallbackRegionalOngkir(prov, city);
                }
            } catch (e) {
                currentCalculatedOngkir = getFallbackRegionalOngkir(prov, city);
            }
            recalculateSummaryUI();
        }

        async function applyVoucherCheckout() {
            const code = document.getElementById('chkVoucher')?.value.trim();
            if (!code) return;
            try {
                const res = await apiGet('check_voucher', { code: encodeURIComponent(code) });
                if (res.valid) {
                    const rawSubtotal = checkoutSelectedItems.reduce((sum, item) => sum + ((item.product.price + (item.extraPrice || 0)) * item.quantity), 0);
                    const discPct = parseFloat(res.discount_percent || res.discount_amount || 0);
                    currentVoucherDiscount = rawSubtotal * (discPct / 100.0);
                    appliedVoucherCode = code;
                    showMessage('Voucher Berhasil', `Diskon ${discPct}% berhasil dipasang!`);
                    recalculateSummaryUI();
                } else {
                    showMessage('Voucher Tidak Valid', res.message || 'Kode tidak ditemukan atau sudah kadaluarsa.');
                }
            } catch(e) { showMessage('Error', 'Gagal memvalidasi voucher.'); }
        }

        function recalculateSummaryUI() {
            const container = document.getElementById('summaryContainer');
            if (!container) return;
            const subtotal = checkoutSelectedItems.reduce((sum, item) => sum + ((item.product.price + (item.extraPrice || 0)) * item.quantity), 0);
            const grandTotal = (subtotal - currentVoucherDiscount) + currentCalculatedOngkir;
            let bonusHtml = '';
            
            // Filter dan tampilin Bonus Items dari checkoutSelectedItems 
            const bonusItems = checkoutSelectedItems.filter(i => i.parentProductId);
            if (bonusItems.length > 0) {
                bonusHtml = bonusItems.map(b => `<div class="flex justify-between text-[10px] text-pink-custom"><span>🎁 Bonus Gratis: ${b.product.name} (${b.quantity}x)</span><span>Rp 0</span></div>`).join('');
            }
            
            container.innerHTML = `
                <div class="flex justify-between"><span>Subtotal Produk:</span><span>${formatRupiah(subtotal)}</span></div>
                ${bonusHtml}
                <div class="flex justify-between text-pink-custom"><span>Diskon Voucher (${appliedVoucherCode || '-'}):</span><span>-${formatRupiah(currentVoucherDiscount)}</span></div>
                <div class="flex justify-between"><span>Ongkos Kirim Lokal:</span><span id="txtOngkir">${formatRupiah(currentCalculatedOngkir)}</span></div>
                <hr class="my-1">

            `;
        }

        async function submitOrderProcess(subtotal) {
            const name = document.getElementById('chkName')?.value.trim();
            const phone = document.getElementById('chkPhone')?.value.trim();
            const prov = document.getElementById('chkProv')?.value || '';
            const city = document.getElementById('chkCity')?.value || '';
            const address = document.getElementById('chkAddress')?.value.trim();
            const benchmark = document.getElementById('chkBenchmark')?.value.trim();
            const deliveryDate = document.getElementById('chkDeliveryDate')?.value;
            const rawDeliveryTime = document.getElementById('chkDeliveryTime')?.value;
            const courier = document.getElementById('chkCourier')?.value;
            const payment = document.getElementById('chkPayment')?.value;
            const fileInput = document.getElementById('proofFile');
            
            if (!name || !phone || !prov || !city || !address || !benchmark || !deliveryDate || !rawDeliveryTime) {
                return showMessage('Validasi Gagal', 'Harap isi Nama, No HP, Provinsi, Kota, Alamat, Patokan Rumah, serta Tanggal & Jam Pengiriman Kue!');
            }
            if (!fileInput.files[0] && !payment.includes('COD')) {
                return showMessage('Validasi Gagal', 'Wajib mengunggah Bukti Pembayaran sebelum melakukan konfirmasi!');
            }
            
            const estimateText = document.getElementById('estimateInfoCard').classList.contains('hidden') ? "" : document.getElementById('estimateText').innerText;
            const finalDTime = estimateText ? `${rawDeliveryTime}\n${estimateText}` : rawDeliveryTime;

            localStorage.setItem('cust_name', name);
            localStorage.setItem('cust_phone', phone);
            localStorage.setItem('cust_address', address);
            localStorage.setItem('cust_benchmark', benchmark);
            
            let base64Proof = "";
            if (fileInput.files[0]) {
                base64Proof = await toBase64(fileInput.files[0]);
            }
            
            const fullAddress = `${address} (Patokan: ${benchmark}), Kota ${city}, ${prov}`;
            const realSubtotal = checkoutSelectedItems.reduce((sum, item) => sum + ((item.product.price + (item.extraPrice || 0)) * item.quantity), 0);
            const grandTotal = (realSubtotal - currentVoucherDiscount) + currentCalculatedOngkir;
            
            let finalPayloadItems = checkoutSelectedItems.map(i => ({
                product_id: i.product.id, quantity: i.quantity, price: i.product.price + (i.extraPrice || 0),
                size: i.selectedSize, flavor: i.selectedFlavor, custom_message: i.customMessage, cream_color: i.creamColor
            }));

            const orderPayload = {
                action: 'create_order',
                name, phone, address: fullAddress, benchmark, payment, courier,
                subtotal: realSubtotal, discount: currentVoucherDiscount, shipping_fee: currentCalculatedOngkir, grand_total: grandTotal,
                voucher_code: appliedVoucherCode,
                delivery_date: deliveryDate, delivery_time: finalDTime,
                payment_proof_base64: base64Proof,
                items: finalPayloadItems
            };
            fetch(BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(orderPayload)
            }).then(r => r.json()).then(res => {
                if (res.success) {
                    checkoutSelectedItems.forEach(ci => {
                        const p = products.find(x => x.id === ci.product.id);
                        if (p) p.stock = Math.max(0, p.stock - ci.quantity);
                    });
                    cart = [];
                    localStorage.removeItem('cart');
                    showMessage('Sukses', 'Pesanan Anda berhasil dibuat dan stok produk otomatis berkurang!');
                    showOrdersHistory(phone);
                } else {
                    showMessage('Gagal', res.message || 'Gagal membuat pesanan.');
                }
            });
        }
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        // ================= HELPER UTAMA SELLER & API =================
        async function apiGet(action, params = {}) {
            const query = new URLSearchParams({ action, ...params });
            const response = await fetch(`${BASE_URL}?${query.toString()}`, {
                method: 'GET', cache: 'no-store', redirect: 'follow',
                headers: { 'Accept': 'application/json' }
            });
            if (!response.ok) throw new Error(`Server mengembalikan HTTP ${response.status}`);
            const result = await response.json();
            if (!result || result.success === false) throw new Error(result?.message || 'Permintaan gagal.');
            return result;
        }
        async function apiPost(action, data = {}) {
            const response = await fetch(BASE_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8', 'Accept': 'application/json' },
                body: JSON.stringify({ action, ...data }),
                redirect: 'follow'
            });
            if (!response.ok) throw new Error(`Server mengembalikan HTTP ${response.status}`);
            const result = await response.json();
            if (!result || result.success === false) throw new Error(result?.message || 'Permintaan gagal.');
            return result;
        }

                const result = await apiPost('delete_product', { id });
                showMessage('Produk', result.message || 'Produk dihapus.');
                await refreshSellerData();
                showManageProducts();
            } catch (error) { showMessage('Gagal menghapus produk', error.message); }
        }
        // Jalankan Pemuatan Data Awal Web App
        loadAllData();
    </script>
</body>
</html>
